[project]
name = "vybd-cli"
version = "0.0.0"
description = "Thin HTTP client for the Vybd server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "tomli-w>=1.0",
]

[project.scripts]
vybd = "vybd_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vybd_cli"]
