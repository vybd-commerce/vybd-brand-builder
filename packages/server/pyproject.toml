[project]
name = "vybd-server"
version = "0.0.0"
description = "HTTP API: users, brands, challenges, scoring, runs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vybd-brain",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[tool.uv.sources]
vybd-brain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]
