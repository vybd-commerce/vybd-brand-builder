[project]
name = "vybd-runner"
version = "0.0.0"
description = "Background run engine: phases, budget, checkpoints"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vybd-brain",
    "vybd-server",
]

[tool.uv.sources]
vybd-brain = { workspace = true }
vybd-server = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runner"]
