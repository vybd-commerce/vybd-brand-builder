services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vybd
      POSTGRES_PASSWORD: vybd
      POSTGRES_DB: vybd
    ports:
      - "${VYBD_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vybd -d vybd"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
